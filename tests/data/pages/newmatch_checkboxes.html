&lt;div class=&#34;problem&#34;&gt;
  &lt;div&gt;
&lt;p&gt;Разработка спортограмм на основании профессиограмм конкретных профессий.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Цель задания: &lt;/strong&gt;освоить подбор физических упражнений и видов спорта, наилучшим образом соответствующие требованиям конкретной профессии исходя из ее профессиограммы.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Инструкция по выполнению: &lt;/strong&gt;на основании анализа профессиограммы операторских профессий и профессиограммы педагога, представленных в таблицах 1 и 2, разработайте спортограммы данных профессий. Для этого отметьте в соответствующих ячейках таблицы 1 и таблицы 2 те виды двигательной активности, с помощью которых можно развивать профессионально значимые для этих профессий функции и качества.&lt;/p&gt;
  &lt;p style=&#34;text-align: right;&#34;&gt;Таблица 1 - Профессиограмма и спортограмма для операторских профессий&lt;/p&gt;
